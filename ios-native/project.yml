# XcodeGen spec. On a Mac: brew install xcodegen && xcodegen generate
name: CatLogic
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CatLogicKit:
    path: CatLogicKit
targets:
  CatLogic:
    type: application
    platform: iOS
    sources:
      - path: CatLogic
    dependencies:
      - package: CatLogicKit
      - sdk: GameKit.framework
    entitlements:
      path: CatLogic/CatLogic.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: CatLogic/Info.plist
      properties:
        CFBundleDisplayName: Cat Logic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIAppFonts:
          - Nunito_500Medium.ttf
          - Nunito_700Bold.ttf
          - Nunito_800ExtraBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.catlogic # change before shipping (/replica-brand)
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # set your team in Xcode > Signing & Capabilities
schemes:
  CatLogic:
    build:
      targets:
        CatLogic: all
    run:
      config: Debug
    archive:
      config: Release
